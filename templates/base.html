<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <base target="_blank">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Peter Tallosy. Physicist and research engineer working on inference optimization at mesh.applied.">
    <meta property="og:title" content="{{NAME}}">
    <meta property="og:description" content="Physicist and research engineer. Inference optimization at mesh.applied.">
    <meta property="og:type" content="website">
    <link rel="canonical" href="https://peter.tallosy.hu/">
    <title>{{NAME}}</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <div class="page">
        <header class="masthead">
            <img class="photo" src="{{PHOTO}}" alt="Peter Tallosy" width="88" height="88">
            <div>
                <h1>{{NAME}}</h1>
                <p class="lede">{{INTRO}}</p>
                <p class="contact">
                    <a href="{{GITHUB}}" rel="noopener">GitHub</a>
                    <a href="{{LINKEDIN}}" rel="noopener">LinkedIn</a>
                    <a href="mailto:{{EMAIL}}">{{EMAIL}}</a>
                </p>
            </div>
        </header>

        <main>
            <section class="block">
                <div class="prose">{{BIO}}</div>
            </section>

            <section class="block">
                <h2>Now</h2>
                {{NOW}}
            </section>

            <section class="block">
                <h2>Projects</h2>
                {{WORK}}
            </section>

            <section class="block">
                <h2>Research</h2>
                {{RESEARCH}}
            </section>

            <section class="block">
                <h2>Writing</h2>
                {{WRITING}}
            </section>

            <section class="block">
                <h2>Talks</h2>
                {{TALKS}}
            </section>

            <section class="block">
                <h2>GitHub</h2>
                {{CODE}}
                <div id="gh-graph" data-user="{{GITHUB_USER}}"></div>
                <p class="gh-caption">contributions, last 12 months</p>
            </section>
        </main>

        <footer>
            <p>{{NAME}}, {{YEAR}}</p>
        </footer>
    </div>

    <script src="js/script.js"></script>
</body>

</html>
